name: zynox_admin
description: "Master Admin Control Panel for Zynox TV Ecosystem"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Local Storage
  shared_preferences: ^2.2.3
  
  # Backend and Connection Config
  supabase_flutter: ^2.6.0
  http: ^1.2.0

  # File Handlers, Images & Device info Tracker tools 
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  device_info_plus: ^10.1.2
  path_provider: ^2.1.3
  uuid: ^4.4.0
  crypto: ^3.0.3

  # Web, PDF, Shares tools limits dependencies
  share_plus: ^9.0.0

  # Miscellaneous 
  video_player: ^2.8.6


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0


flutter:
  uses-material-design: true

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
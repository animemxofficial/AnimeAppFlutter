name: zynox_admin
description: "Master Admin Control Panel for Zynox TV"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.6.0
  flutter_local_notifications: ^17.1.2
  http: ^1.2.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_logo.png"
  adaptive_icon_background: "#000000" # Yeh tumhare background ko black kar dega
  adaptive_icon_foreground: "assets/icon/app_logo.png" # Yeh tumhara Z wala transparent logo lagayega


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true